<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ảnh kết quả bài tập 27 của Duong Nhat Quang." />
    <title>Bài tập 27 | Duong Nhat Quang</title>
    <link rel="stylesheet" href="home.css" />
    <style>
      .result-page {
        width: min(100%, 900px);
        margin: 35px auto;
        padding: 0 18px;
      }
      .result-card {
        padding: clamp(18px, 5vw, 40px);
        border: 1px solid #e8e8f1;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 55px rgb(38 38 75 / 7%);
      }
      .result-card h1 { margin-top: 0; }
      .result-card img {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 22px;
        border: 1px solid #e7e7ef;
        border-radius: 12px;
      }
      .result-note { color: #73748a; line-height: 1.7; }
      .back-link { display: inline-block; margin-top: 22px; color: #514ba8; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="result-page">
      <article class="result-card">
        <p class="section-heading__eyebrow">BÀI TẬP 27</p>
        <h1>Kết quả bài đánh giá</h1>
        <p class="result-note">
          Hình ảnh kết quả do Duong Nhat Quang cung cấp: 57 câu đúng, 1 câu đúng một phần,
          3 câu sai; độ chính xác hiển thị là 95%.
        </p>
        <img src="assets/bt27-result.png" alt="Ảnh tổng kết kết quả bài đánh giá của Quang" />
        <a class="back-link" href="index.html">← Trở về trang chủ</a>
      </article>
    </main>
  </body>
</html>
